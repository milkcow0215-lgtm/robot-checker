<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>반납로봇 검수기</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 12px; background: #f1f3f4; color: #202124;
    }
    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { font-size: 19px; margin: 4px 0; }
    
    #scanner-container {
      width: 100%; max-width: 480px; margin: 0 auto;
      border-radius: 12px; overflow: hidden; background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #reader { width: 100%; }

    .manual-box {
      max-width: 480px; margin: 12px auto 0; display: flex; gap: 8px;
    }
    .manual-box input {
      flex: 1; padding: 10px 12px; border: 1px solid #dadce0;
      border-radius: 6px; font-size: 14px; outline: none;
    }
    .manual-box button {
      padding: 10px 16px; background: #1a73e8; color: white;
      border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
    }

    #result-card {
      max-width: 480px; margin: 14px auto 0; padding: 16px;
      border-radius: 10px; display: none; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .card-success { background: #e6f4ea; border: 2px solid #137333; color: #137333; }
    .card-danger { background: #fce8e6; border: 2px solid #c5221f; color: #c5221f; }
    .card-loading { background: #e8f0fe; border: 2px solid #1a73e8; color: #1a73e8; }

    .title-row { font-size: 18px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .row-item { margin: 4px 0; font-size: 14px; color: #3c4043; }
    .row-item b { color: #202124; }
    
    .btn-action {
      display: block; width: 100%; padding: 12px; margin-top: 12px;
      border: none; border-radius: 6px; font-size: 15px; font-weight: bold;
      color: white; cursor: pointer; text-align: center;
    }
    .btn-next { background: #1a73e8; }
    .btn-retry { background: #c5221f; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 반납로봇 현장 검수</h1>
  </div>

  <div id="scanner-container">
    <div id="reader"></div>
  </div>

  <div class="manual-box">
    <input type="text" id="manualInput" placeholder="MAC 직접 입력 또는 스캔">
    <button onclick="handleManualSearch()">검색</button>
  </div>

  <div id="result-card"></div>

  <script>
    // [1단계]에서 복사한 Apps Script 웹 앱 URL을 여기에 붙여넣으세요.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWffRnlKqu0EczzxSUmWelY6csP_U2euGyBIVLahlCP6ZrjG5s_-KCJiHb5cMgpJYgCw/exec";

    let html5QrCode;
    let isProcessing = false;

    // 간단한 사운드 피드백 (성공 삐-익 / 실패 삐-삐-)
    function playBeep(success) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (success) {
          osc.frequency.value = 1046.5; // High C (기분 좋은 톤)
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
          osc.stop(ctx.currentTime + 0.15);
        } else {
          osc.frequency.value = 330.0; // Low E (경고 톤)
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function checkMac(scannedText) {
      if (isProcessing) return;
      isProcessing = true;

      if (navigator.vibrate) navigator.vibrate(80);

      const card = document.getElementById('result-card');
      card.className = 'card-loading';
      card.style.display = 'block';
      card.innerHTML = `<div class="title-row">🔍 검수 중...</div><div class="row-item">스캔값: ${scannedText}</div>`;

      fetch(`${SCRIPT_URL}?mac=${encodeURIComponent(scannedText)}`)
        .then(res => res.json())
        .then(res => {
          if (res.found) {
            playBeep(true);
            card.className = 'card-success';
            card.innerHTML = `
              <div class="title-row">
                <span>✅ 리스트 일치</span>
                <span>시트 ${res.row}행</span>
              </div>
              <div class="row-item"><b>NO:</b> ${res.data.no}</div>
              <div class="row-item"><b>모델:</b> ${res.data.model} (${res.data.detail || '-'})</div>
              <div class="row-item"><b>자산번호:</b> ${res.data.assetNo || '-'}</div>
              <div class="row-item"><b>관리번호:</b> ${res.data.manageNo || '-'}</div>
              <div class="row-item"><b>MAC:</b> ${res.data.mac}</div>
              <button class="btn-action btn-next" onclick="resumeScanning()">다음 기기 스캔</button>
            `;
          } else {
            playBeep(false);
            card.className = 'card-danger';
            card.innerHTML = `
              <div class="title-row">❌ 미등록 기기</div>
              <div class="row-item"><b>사유:</b> ${res.message}</div>
              <div class="row-item"><b>스캔값:</b> ${scannedText}</div>
              <button class="btn-action btn-retry" onclick="resumeScanning()">다시 스캔</button>
            `;
          }
        })
        .catch(err => {
          card.className = 'card-danger';
          card.innerHTML = `
            <div class="title-row">⚠️ 통신 오류</div>
            <div class="row-item">${err.message}</div>
            <button class="btn-action btn-retry" onclick="resumeScanning()">재시도</button>
          `;
        });
    }

    function resumeScanning() {
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('manualInput').value = '';
      isProcessing = false;
    }

    function handleManualSearch() {
      const val = document.getElementById('manualInput').value.trim();
      if (!val) return alert('MAC 번호를 입력해주세요.');
      checkMac(val);
    }

    window.addEventListener('DOMContentLoaded', () => {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        {
          fps: 12,
          qrbox: { width: 230, height: 230 },
          aspectRatio: 1.0
        },
        (decodedText) => checkMac(decodedText),
        (errorMessage) => {} // 스캔 탐색 중 에러는 무시
      ).catch(err => {
        console.warn("카메라 구동 실패 또는 권한 없음:", err);
      });
    });
  </script>
</body>
</html>
